name: pdm
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: pdm-tapeout-bsv
  display_name: PDM
  summary: 'A PDM microphone interface: CIC decimation followed by a compensation FIR.'
  category: peripheral
  subcategories:
  - pdm
  ip_family: pdm
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 8
    dw: 32
params:
  dataWidth:
    type: int
    default: 32
    range:
    - 1
    - 32
    desc: width of the data and mirror registers
features:
  invert:
    type: bool
    default: false
emit:
- kind: bsv
  package: Pdm
  module: mkPdm
  config_type: PdmCfg
  interface: PdmIfc
  ctrl: regs
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
